name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assert .nojekyll exists
        run: test -f .nojekyll

      - name: Assert index.html exists
        run: test -f index.html

      - name: Verify generated signage data is current
        run: node tools/gen-signage.mjs --check

      - name: Verify room 07 replays the encoder's own merge loop
        run: node tools/check-bpe.mjs

      - name: Verify room 08's cents, ratios and beat rates
        run: node tools/check-comma.mjs

      - name: Verify room 09's exact decimal expansions
        run: node tools/check-gap.mjs

      - name: Verify room 10's constants, convergents and best-approximation claim
        run: node tools/check-convergents.mjs

      - name: Verify room 11's exhaustive claims about liars
        run: node tools/check-liars.mjs

      - name: Assert no absolute-rooted href/src paths
        run: |
          if grep -rEn '(href|src)=["'"'"']/' --include='*.html' --include='*.js' --include='*.css' .; then
            echo "Found an href/src attribute starting with a leading '/'. All paths must stay relative." >&2
            exit 1
          fi
