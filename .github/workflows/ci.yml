name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Assert .nojekyll exists
        run: test -f .nojekyll

      - name: Assert index.html exists
        run: test -f index.html

      - name: Verify generated signage data is current
        run: node tools/gen-signage.mjs --check

      - name: Assert no absolute-rooted href/src paths
        run: |
          if grep -rEn '(href|src)=["'"'"']/' --include='*.html' --include='*.js' --include='*.css' .; then
            echo "Found an href/src attribute starting with a leading '/'. All paths must stay relative." >&2
            exit 1
          fi
